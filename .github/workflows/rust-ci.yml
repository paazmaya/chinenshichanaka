# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  testing:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        # https://github.com/step-security/harden-runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull LFS data
        # Checkout will only fetch the data but will not expand the files
        run: git lfs pull

      - name: Use stable Rust
        # Ensure that the following steps are using the stable toolchain
        run: rustup default stable

      # Cache Cargo dependencies, https://github.com/Swatinem/rust-cache
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # https://github.com/cargo-bins/cargo-binstall
      - name: Install binary installation tool for cargo
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache clippy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/.clippy_cache
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        # https://github.com/rust-lang/rust-clippy
        run: cargo clippy -- -D warnings

      - name: Build binary for tests
        run: cargo build

      - name: Run unit and doc tests
        run: cargo test

      # https://github.com/xd009642/tarpaulin
      - name: Install code coverage tool
        run: cargo binstall cargo-tarpaulin
        # Install takes a bit over 4 mins, while binstall 12 seconds

      - name: Measure code coverage
        # Skip removing executable before compilation so cli can be tested
        run: cargo tarpaulin --out xml --follow-exec --skip-clean

      - name: Upload code coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml # The name of the coverage report generated by tarpaulin

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage information to codacy
        # https://github.com/codacy/codacy-coverage-reporter-action
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  packaging:
    name: Generate Build Artifacts
    permissions:
      contents: read

    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-24.04, windows-2022, macos-15]

    runs-on: ${{ matrix.os }}
    if: matrix.os == 'ubuntu-24.04' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Harden the runner (Audit all outbound calls)
        # https://github.com/step-security/harden-runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull LFS data
        # Checkout will only fetch the data but will not expand the files
        run: git lfs pull

      - name: Use stable Rust
        # Ensure that the following steps are using the stable toolchain
        run: rustup default stable

      # Cache Cargo dependencies, https://github.com/Swatinem/rust-cache
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # https://github.com/cargo-bins/cargo-binstall
      - name: Install binary installation tool for cargo
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Package to be installable
        # https://github.com/crabnebula-dev/cargo-packager
        shell: bash
        run: |
          if ! [ -f ~/.cargo/bin/cargo-packager ]; then
            cargo binstall cargo-packager
          fi
          cargo packager --release --verbose

      - name: Store package installer artifacts
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/
            !packages/.cargo-packager
