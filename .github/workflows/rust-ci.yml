# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  testing:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        # https://github.com/step-security/harden-runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        # https://github.com/chainguard-actions/actions-checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull LFS data
        # Checkout will only fetch the data but will not expand the files
        run: git lfs pull

      - name: Use stable Rust
        # Ensure that the following steps are using the stable toolchain
        run: rustup default stable

      # Cache Cargo dependencies, https://github.com/chainguard-actions/Swatinem-rust-cache
      - name: Rust Cache
        uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      # https://github.com/cargo-bins/cargo-binstall
      - name: Install binary installation tool for cargo
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

      - name: Install clippy and LLVM tools
        run: rustup component add clippy llvm-tools-preview

      - name: Cache clippy results
        uses: chainguard-actions/actions-cache@46c2783c2418d3de33490be27a0d86c6268bc4fd # v6.1.0
        with:
          path: ~/.cargo/.clippy_cache
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        # https://github.com/rust-lang/rust-clippy
        run: cargo clippy -- -D warnings

      - name: Build binary for tests
        run: cargo build

      - name: Install testing tools
        run: cargo binstall --no-confirm cargo-deny cargo-nextest cargo-llvm-cov

      - name: Run tests and generate coverage report
        run: cargo llvm-cov nextest --profile ci --locked --cobertura --output-path cobertura.xml

      - name: Upload code coverage to codecov
        uses: chainguard-actions/codecov-codecov-action@4e95a2ab133962d45d778e4ce39d1e21e4e536de # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml # The name of the coverage report

      - name: SonarQube Scan
        uses: chainguard-actions/SonarSource-sonarqube-scan-action@ae1b337c32ef94ef76201f2bc5149d77eaa4b218 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage information to codacy
        # https://github.com/codacy/codacy-coverage-reporter-action
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  packaging:
    name: Generate Build Artifacts
    permissions:
      contents: read

    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-24.04, windows-2022, macos-15]

    runs-on: ${{ matrix.os }}
    if: matrix.os == 'ubuntu-24.04' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Harden the runner (Audit all outbound calls)
        # https://github.com/step-security/harden-runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        # https://github.com/chainguard-actions/actions-checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull LFS data
        # Checkout will only fetch the data but will not expand the files
        run: git lfs pull

      - name: Use stable Rust
        # Ensure that the following steps are using the stable toolchain
        run: rustup default stable

      # Cache Cargo dependencies, https://github.com/chainguard-actions/Swatinem-rust-cache
      - name: Rust Cache
        uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      # https://github.com/cargo-bins/cargo-binstall
      - name: Install binary installation tool for cargo
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

      - name: Package to be installable
        # https://github.com/crabnebula-dev/cargo-packager
        shell: bash
        run: |
          if ! [ -f ~/.cargo/bin/cargo-packager ]; then
            cargo binstall cargo-packager
          fi
          cargo packager --release --verbose

      - name: Store package installer artifacts
        # https://github.com/chainguard-actions/actions-upload-artifact
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/
            !packages/.cargo-packager
